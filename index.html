<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horarios de clase | Enfermeria</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KUROMI MARYLAND">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <!-- Reloj Digital Grande -->
            <div id="live-clock" class="live-clock">00:00</div>
            
            <h1>BIENVENIDA A MARYLAND, ENFERMERA JAZMIN 🎀</h1>
            <p id="current-date"></p>
        </header>
        <section class="stats-container">
            <div class="stat-card">
                <div class="stat-number" id="stat-classes">0</div>
                <div class="stat-label">Clases añadidas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-reminders">0</div>
                <div class="stat-label">Recordatorios pendientes</div>
            </div>
        </section>

        <section class="card schedule-section">
            <h2>📚 Horario de Clases</h2>
            <div id="class-list" class="list-container">
                <div class="empty-state">No hay clases registradas.</div>
            </div>
            <button onclick="openModal('class-modal')" class="add-btn">+ Agregar Clase</button>
        </section>

        <section class="card reminder-section">
            <h2>💀 Recordatorio de tareas & reuniones</h2>
            <div id="reminder-list" class="list-container">
                <div class="empty-state">Todo limpio por ahora... 😈</div>
            </div>
            <button onclick="openModal('reminder-modal')" class="add-btn">+ Nuevo Recordatorio</button>
        </section>
    </div>

    <!-- Modal CLASES -->
    <div id="class-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('class-modal')">&times;</span>
            <h3>Nueva Clase 📚</h3>
            
            <label>Nombre de la Materia:</label>
            <input type="text" id="class-name" placeholder="ej. Cálculo II">
            
            <label>Profesor/a:</label>
            <input type="text" id="class-teacher" placeholder="ej. Dr. Smith">
            
            <div class="time-row">
                <div>
                    <label>Hora Inicio:</label>
                    <input type="time" id="class-time-start">
                </div>
                <div>
                    <label>Hora Fin:</label>
                    <input type="time" id="class-time-end">
                </div>
            </div>
            
            <label>Aula / Salón:</label>
            <input type="text" id="class-room" placeholder="ej. A-204">
            
            <label>Días de la Semana:</label>
            <div class="days-selector">
                <label><input type="checkbox" name="day" value="L"> L</label>
                <label><input type="checkbox" name="day" value="M"> M</label>
                <label><input type="checkbox" name="day" value="X"> X</label>
                <label><input type="checkbox" name="day" value="J"> J</label>
                <label><input type="checkbox" name="day" value="V"> V</label>
                <label><input type="checkbox" name="day" value="S"> S</label>
            </div>
            
            <div class="date-range">
                <div>
                    <label>Mes Inicio:</label>
                    <select id="start-month">
                        <option value="">Seleccionar...</option>
                        <option value="Enero">Enero</option><option value="Febrero">Febrero</option><option value="Marzo">Marzo</option><option value="Abril">Abril</option><option value="Mayo">Mayo</option><option value="Junio">Junio</option><option value="Julio">Julio</option><option value="Agosto">Agosto</option><option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option><option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
                    </select>
                </div>
                <div>
                    <label>Mes Fin:</label>
                    <select id="end-month">
                        <option value="">Seleccionar...</option>
                        <option value="Enero">Enero</option><option value="Febrero">Febrero</option><option value="Marzo">Marzo</option><option value="Abril">Abril</option><option value="Mayo">Mayo</option><option value="Junio">Junio</option><option value="Julio">Julio</option><option value="Agosto">Agosto</option><option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option><option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option>
                    </select>
                </div>
            </div>
            
            <button onclick="addClass()" class="save-btn">+ Añadir clase 💜</button>
        </div>
    </div>

    <!-- Modal RECORDATORIOS -->
    <div id="reminder-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('reminder-modal')">&times;</span>
            <h3>Nuevo Recordatorio 💀</h3>
            <label>Título:</label>
            <input type="text" id="rem-title" placeholder="ej. Entrega Proyecto">
            
            <label>Fecha y Hora:</label>
            <input type="datetime-local" id="rem-datetime">
            
            <label>Detalles:</label>
            <textarea id="rem-desc" rows="3" placeholder="Notas adicionales..."></textarea>
            
            <button onclick="addReminder()" class="save-btn">+ Añadir recordatorio 💜</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
